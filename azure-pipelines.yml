# Trigger relay: fires on every push to sc-paradigm1, extracts build parameters
# from the commit message, and queues "Paradigm - Build with Source Control".
#
# Commit message format expected: "<version>; TaskID: <value>"
#   e.g. "v1.0.1; TaskID: V1.0.1"
#
# Mapping applied:
#   packageName (required by target pipeline) <- TaskID value from commit message
#   tasksList   <- TaskID value from commit message
#   buildType   -> 'Specific Tasks'
#   tags        -> left empty

trigger:
  branches:
    include:
      - main

pool: NicolasHosted   # matches the pool used by build-source-control.yml; change if this repo should use a different agent pool

variables:
  targetOrganization: 'https://dev.azure.com/dbmsc'
  targetProject: 'poc'
  targetPipelineId: '53'   # Paradigm - Build with Source Control

steps:
  - checkout: self
    fetchDepth: 1

  - bash: |
      set -e

      commitHash=$(git rev-parse HEAD)
      commitMessage=$(git log -1 --format='%s')

      echo "Commit: $commitHash"
      echo "Message: $commitMessage"

      # Extract the TaskID value: everything after "TaskID:" up to the next ';' or end of line
      taskId=$(echo "$commitMessage" | sed -n 's/.*TaskID:[[:space:]]*\([^;]*\).*/\1/p' | xargs)

      if [ -z "$taskId" ]; then
        echo "##vso[task.logissue type=error]Could not find 'TaskID: <value>' in commit message: $commitMessage"
        exit 1
      fi

      echo "##vso[task.setvariable variable=packageName]$taskId"
      echo "##vso[task.setvariable variable=taskId]$taskId"
    displayName: 'Extract parameters from commit message'

  - bash: |
      set -e
      az extension add --name azure-devops --only-show-errors
      echo "$SYSTEM_ACCESSTOKEN" | az devops login --organization "$(targetOrganization)"

      az pipelines run \
        --organization "$(targetOrganization)" \
        --project "$(targetProject)" \
        --id "$(targetPipelineId)" \
        --parameters packageName="$(packageName)" buildType="Specific Tasks" tasksList="$(taskId)"
    displayName: 'Queue Paradigm - Build with Source Control'
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
